name: CI

on:
  push:
    branches: [main, prod/railway]
  pull_request:
    branches: [main, prod/railway]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drinkanddraw
          POSTGRES_PASSWORD: drinkanddraw
          POSTGRES_DB: drinkanddraw
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U drinkanddraw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://drinkanddraw:drinkanddraw@localhost:5432/drinkanddraw
      AUTH_SECRET: test-secret-test-secret-test-secret
      STORAGE_DRIVER: local
      LOCAL_IMAGE_DIR: ./sample-images
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --include=optional

      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build
